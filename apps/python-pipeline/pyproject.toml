[project]
name = "parnassix-pipeline"
version = "0.1.0"
description = "Document ingestion and provenance-preserving retrieval for Parnassix reports"
readme = "README.md"
# Upper bound is not stylistic: llama-index-vector-stores-redis declares
# python <3.14, and the machine's system python is 3.14. uv pins 3.13 here.
requires-python = ">=3.12,<3.14"

dependencies = [
    "docling>=2.126.0",
    "docling-core>=2.96.0",
    "llama-index-core>=0.14.24",
    "llama-index-readers-docling>=0.5.0",
    "llama-index-node-parser-docling>=0.5.0",
    "llama-index-vector-stores-redis>=0.9.0",
    "llama-index-embeddings-ollama>=0.10.0",
    "llama-index-llms-ollama>=0.11.0",
    # Pinned by llama-index-vector-stores-redis, which requires <0.5. The
    # SemanticCache used for query caching therefore comes from the 0.4 line,
    # not the current 0.27 release. Bumping this means dropping the LlamaIndex
    # Redis integration for a redisvl-native store.
    "redisvl>=0.4.1,<0.5",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "rich>=13.9",
]

[project.optional-dependencies]
# Apple's Vision framework. macOS only, no model download, and by a wide margin
# the best OCR available here - including the only real handwriting support.
ocrmac = ["ocrmac>=1.0.0"]
bedrock = [
    "llama-index-embeddings-bedrock>=0.9.0",
    "llama-index-llms-bedrock-converse>=0.15.0",
]
# Any OpenAI-wire-format endpoint: an exo cluster, vLLM, LM Studio, or a gateway.
compatible = [
    "llama-index-embeddings-openai-like>=0.4.0",
    "llama-index-llms-openai-like>=0.8.0",
]
# Kept out of the default install: sentence-transformers drags in its own torch
# stack, and the Ollama path is the default. Install when comparing providers.
huggingface = ["llama-index-embeddings-huggingface>=0.8.0"]
# Lower bound kept at 0.6 deliberately: llama-index-embeddings-openai-like (the
# `compatible` extra) pins <0.7, and the two extras have to be installable
# together - a gateway in front of OpenAI needs both.
openai = [
    "llama-index-embeddings-openai>=0.6.0",
    "llama-index-llms-openai>=0.6.0",
]

[project.scripts]
parnassix-pipeline = "parnassix_pipeline.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "datamodel-code-generator>=0.81.0",
    "httpx>=0.28",
    "reportlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parnassix_pipeline"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` in a parameter default is FastAPI's dependency-injection
# idiom, not the mutable-default bug B008 exists to catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
