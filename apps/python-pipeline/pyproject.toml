[project]
name = "parnassix-pipeline"
version = "0.1.0"
description = "Report-schema contract and provenance wiring over the pythoness library"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # The engine. Everything this app used to contain -- conversion, chunking,
    # provenance, embeddings, the vector store, the semantic cache, hardware
    # tiering, retrieval, the tool registry -- lives here now.
    "parnassix",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.9",
    "typer>=0.15",
    "rich>=13.9",
]

[tool.uv.sources]
# A path dependency, not a version, because `parnassix` is not published yet.
#
# The cost is real and worth naming: this app does not build on a machine that
# does not have the pythoness repository checked out at that path. It is the
# price of co-developing a library and its first consumer in two repositories,
# and it goes away the moment `parnassix` is on PyPI -- at which point this
# becomes a pinned version and `uv.lock` carries it like any other dependency.
parnassix = { path = "../../../Pythoness/pythoness", editable = true }

[project.scripts]
parnassix-pipeline = "parnassix_pipeline.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "datamodel-code-generator>=0.81.0",
    "httpx>=0.28",
    "reportlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parnassix_pipeline"]

# `report/schema.json` and `report/_generated.py` are picked up by the package
# glob above rather than force-included, because both are BUILD OUTPUTS: they do
# not exist until `pnpm --filter python-pipeline build` has run, and a
# force-include fails the build when its file is missing -- which would make
# `uv sync` impossible before the first codegen, i.e. on every fresh checkout.

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` in a parameter default is FastAPI's dependency-injection
# idiom, not the mutable-default bug B008 exists to catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
